# order-service @ dev. Rendered with the shared "generic" chart pulled from ECR (see argocd/).
# image.tag is written by SqopeAI CI (.github/workflows/main.yml) on every merge to main: do not edit by hand,
# roll back with `git revert` instead.
image:
  repository: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/sqope-ai/order-service
  tag: not-yet-built
# Orders are the busiest path: scale on CPU instead of a fixed replica count.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
env:
  ENVIRONMENT: dev
  LOG_LEVEL: INFO
resources:
  requests:
    cpu: 200m
    memory: 192Mi
  limits:
    memory: 384Mi
